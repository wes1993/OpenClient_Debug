name: Build OpenClient Debug

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if this upstream commit was already processed"
        required: false
        default: false
        type: boolean
      disable_swift_workaround:
        description: "Disable Swift compiler workaround (use upstream code as-is)"
        required: false
        default: false
        type: boolean
      disable_ios18_patch:
        description: "Disable iOS 18 navigation/layout patch (use upstream code as-is)"
        required: false
        default: false
        type: boolean
      disable_keychain_patch:
        description: "Disable SideStore Keychain patch (use upstream code as-is)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: openclient-debug-publisher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          DATA="$(curl -fsSL https://api.github.com/repos/ntoporcov/openclient/commits/main)"
          SHA="$(jq -r .sha <<<"$DATA")"
          DATE="$(jq -r .commit.committer.date <<<"$DATA")"
          AGE=$(($(date -u +%s)-$(date -u -d "$DATE" +%s)))
          CURRENT="$(curl -fsSL https://raw.githubusercontent.com/wes1993/OpenClient_Debug/main/state/upstream-sha.txt 2>/dev/null || true)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force || false }}" = "true" ] || { [ "$SHA" != "$CURRENT" ] && [ "$AGE" -ge 14400 ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ntoporcov/openclient
          ref: ${{ needs.check.outputs.sha }}

      - name: Select latest Xcode
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        env:
          INCLUDE_PROJECT_LOCAL_YAML: "0"
        run: xcodegen generate

      - name: Apply SideStore private Keychain compatibility patch
        if: ${{ !inputs.disable_keychain_patch }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          path = Path("OpenCodeIOSClient/ProviderUsage/ProviderUsageCredentialRepository.swift")
          text = path.read_text()
          
          old = """    convenience init(bundle: Bundle = .main) throws {
                  guard let accessGroup = bundle.object(forInfoDictionaryKey: Self.privateAccessGroupInfoKey) as? String,
                        !accessGroup.isEmpty else {
                      throw ProviderUsageCredentialRepositoryError.invalidConfiguration
                  }
                  self.init(accessGroup: accessGroup, security: SystemProviderUsageSecurityClient())
              }
          """
          
          new = """    convenience init(bundle: Bundle = .main) throws {
                  guard let configuredAccessGroup = bundle.object(forInfoDictionaryKey: Self.privateAccessGroupInfoKey) as? String,
                        !configuredAccessGroup.isEmpty else {
                      throw ProviderUsageCredentialRepositoryError.invalidConfiguration
                  }
          
                  // Personal Debug builds are unsigned in CI and later re-signed by SideStore.
                  // Derive the private Keychain group from the final SideStore bundle identity.
                  let accessGroup: String
                  if let bundleID = bundle.bundleIdentifier,
                     let teamID = bundleID.split(separator: ".").last.map(String.init),
                     teamID.count == 10,
                     teamID.allSatisfy({ $0.isUppercase || $0.isNumber }) {
                      accessGroup = "\\(teamID).\\(bundleID)"
                  } else {
                      accessGroup = configuredAccessGroup
                  }
          
                  self.init(accessGroup: accessGroup, security: SystemProviderUsageSecurityClient())
              }
          """
          
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one known Keychain initializer; refusing to patch changed upstream source.")
          
          path.write_text(text.replace(old, new))
          print("Applied SideStore private Keychain compatibility patch.")
          PY
          
          git diff --check
          git diff -- OpenCodeIOSClient/ProviderUsage/ProviderUsageCredentialRepository.swift
          
      - name: Apply iOS 18 navigation compatibility patch
        if: ${{ !inputs.disable_ios18_patch }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # iOS 18 compatibility fix: bypass NavigationSplitView entirely.
          # iOS 26+ continues through the untouched upstream splitShell.
          root_path = Path("OpenCodeIOSClient/Views/Root/RootView.swift")
          root = root_path.read_text()

          old_import = """import SwiftUI
          """
          new_import = """import SwiftUI
          #if os(iOS)
          import UIKit
          #endif

          private enum IOS18CompatibilityRoute: Hashable {
              case activity
              case project
              case detail
          }
          """
          if root.count(old_import) != 1:
              raise SystemExit(
                  f"Expected exactly one RootView SwiftUI import, found {root.count(old_import)}; "
                  "refusing to patch changed upstream source."
              )
          root = root.replace(old_import, new_import)

          old_state = """    @State private var didRunUITestAutoConnect = false
          """
          new_state = """    @State private var didRunUITestAutoConnect = false
              @State private var ios18NavigationPath: [IOS18CompatibilityRoute] = []
          """
          if root.count(old_state) != 1:
              raise SystemExit(
                  f"Expected exactly one RootView state anchor, found {root.count(old_state)}; "
                  "refusing to patch changed upstream source."
              )
          root = root.replace(old_state, new_state)

          old_app_shell = """    @ViewBuilder
              private var appShell: some View {
                  BrowserRootContainer(
                      browser: shell.browser,
                      usesInspectorPresentation: usesBrowserInspector
                  ) {
                      splitShell
                  }
              }
          """

          new_app_shell = """    @ViewBuilder
              private var appShell: some View {
                  if isIOS18NavigationCompatibilityActive {
                      NavigationStack(path: $ios18NavigationPath) {
                          ProjectListView(
                              facade: shell.projects,
                              connection: shell.connection,
                              configurations: shell.configurations,
                              games: shell.funAndGames,
                              bridge: bridge,
                              providerUsage: shell.providerUsage,
                              isActivitySelected: false,
                              onActivityChosen: {
                                  shell.selectActivity()
                                  if ios18NavigationPath.last != .activity {
                                      ios18NavigationPath.append(.activity)
                                  }
                              }
                          ) {
                              guard shell.hasCurrentProject else { return }
                              shell.selectProjectContent()
                              if ios18NavigationPath.last != .project {
                                  ios18NavigationPath.append(.project)
                              }
                          }
                          .navigationDestination(for: IOS18CompatibilityRoute.self) { route in
                              switch route {
                              case .activity:
                                  ActivityView(
                                      facade: shell.activity,
                                      connection: shell.connection,
                                      providerUsage: shell.providerUsage,
                                      configurations: shell.configurations,
                                      bridge: bridge
                                  ) {
                                      if ios18NavigationPath.last != .detail {
                                          ios18NavigationPath.append(.detail)
                                      }
                                  }

                              case .project:
                                  ProjectContentView(shell: shell, bridge: bridge) {
                                      if ios18NavigationPath.last != .detail {
                                          ios18NavigationPath.append(.detail)
                                      }
                                  }

                              case .detail:
                                  BrowserInspectorContainer(
                                      browser: shell.browser,
                                      isEnabled: false
                                  ) {
                                      offlineBannerColumn(.detail) {
                                          switch shell.detailRoute(isCompact: true) {
                                          case .gitDiff:
                                              GitDiffView(facade: shell.projectFiles)
                                          case .gitFile:
                                              ProjectFileContentView(facade: shell.projectFiles)
                                          case .mcp:
                                              ContentUnavailableView(
                                                  "MCP Servers",
                                                  systemImage: "server.rack",
                                                  description: Text("Toggle servers from the MCP tab.")
                                              )
                                          case let .terminal(id):
                                              TerminalDetailView(facade: shell.terminal, terminalID: id)
                                                  .id(id)
                                          case .selectTerminal:
                                              ContentUnavailableView(
                                                  "Select a Terminal",
                                                  systemImage: "terminal",
                                                  description: Text("Choose a terminal session from the list.")
                                              )
                                          case let .loadingChat(sessionID):
                                              CompactRouteLoadingView(title: "Loading chat...")
                                                  .id(sessionID)
                                          case let .chat(route):
                                              ChatRouteView(route: route, destination: chatDestination)
                                                  .equatable()
                                                  .transition(.identity)
                                          case .selectSession:
                                              ContentUnavailableView(
                                                  "Select a Session",
                                                  systemImage: "bubble.left.and.bubble.right"
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      .toolbarBackground(Color(uiColor: .systemBackground), for: .navigationBar)
                      .toolbarBackground(.visible, for: .navigationBar)
                      .onAppear {
                          configureIOS18OpaqueNavigationBar()
                          syncIOS18NavigationPathToShell()
                      }
                      .onChange(of: shell.isActivitySelected) { _, _ in
                          syncIOS18NavigationPathToShell()
                      }
                      .onChange(of: shell.hasCurrentProject) { _, _ in
                          syncIOS18NavigationPathToShell()
                      }
                      .onChange(of: shell.selectedSessionID) { _, sessionID in
                          guard sessionID != nil, shell.canPresentSelectedSessionDetail else { return }
                          if ios18NavigationPath.last != .detail {
                              ios18NavigationPath.append(.detail)
                          }
                      }
                  } else {
                      BrowserRootContainer(
                          browser: shell.browser,
                          usesInspectorPresentation: usesBrowserInspector
                      ) {
                          splitShell
                      }
                  }
              }
          """

          if root.count(old_app_shell) != 1:
              raise SystemExit(
                  f"Expected exactly one upstream RootView appShell block, found {root.count(old_app_shell)}; "
                  "refusing to patch changed upstream source."
              )
          root = root.replace(old_app_shell, new_app_shell)

          root_anchor = """    private var usesBrowserInspector: Bool {
          """
          root_helper = """    private func syncIOS18NavigationPathToShell() {
                  if shell.isActivitySelected {
                      if ios18NavigationPath.isEmpty {
                          ios18NavigationPath = [.activity]
                      } else if ios18NavigationPath.first != .activity {
                          ios18NavigationPath = [.activity]
                      }
                      return
                  }

                  if shell.hasCurrentProject {
                      if ios18NavigationPath.isEmpty {
                          ios18NavigationPath = [.project]
                      } else if ios18NavigationPath.first != .project {
                          ios18NavigationPath = [.project]
                      }
                      return
                  }

                  ios18NavigationPath = []
              }

              private func configureIOS18OpaqueNavigationBar() {
          #if os(iOS) && !targetEnvironment(macCatalyst)
                  guard ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 18 else { return }

                  let appearance = UINavigationBarAppearance()
                  appearance.configureWithOpaqueBackground()
                  appearance.backgroundColor = .systemBackground
                  appearance.shadowColor = .separator

                  let navigationBar = UINavigationBar.appearance()
                  navigationBar.standardAppearance = appearance
                  navigationBar.scrollEdgeAppearance = appearance
                  navigationBar.compactAppearance = appearance
                  navigationBar.compactScrollEdgeAppearance = appearance
          #endif
              }

              private var isIOS18NavigationCompatibilityActive: Bool {
          #if os(iOS) && !targetEnvironment(macCatalyst)
                  ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 18
          #else
                  false
          #endif
              }

              private var usesBrowserInspector: Bool {
          """
          if root.count(root_anchor) != 1:
              raise SystemExit(
                  f"Expected exactly one usesBrowserInspector anchor, found {root.count(root_anchor)}; "
                  "refusing to patch changed upstream source."
              )
          root = root.replace(root_anchor, root_helper)
          root_path.write_text(root)

          # iOS 18 chat performance compatibility:
          # keep native UICollectionView bounce and upstream bottom pull-to-refresh,
          # but disable the delayed bottom-chase corrections that repeatedly force
          # layout/offset updates. iOS 26+ remains upstream.
          chat_path = Path("OpenCodeIOSClient/Views/Chat/ChatView.swift")
          chat = chat_path.read_text()

          old_bottom_chase = """    @MainActor
              private func scheduleBottomChase(animated: Bool) {
                  bottomChaseTask = Task { @MainActor [weak self] in
                      defer { self?.bottomChaseTask = nil }
                      for delay in [90, 180, 320, 520, 800, 1_200] {
                          try? await Task.sleep(for: .milliseconds(delay))
                          guard !Task.isCancelled, let collectionView = self?.collectionView else { return }
                          collectionView.layoutIfNeeded()
                          guard Self.distanceFromBottom(in: collectionView) > 3 else { return }
                          Self.scrollToBottom(
                              in: collectionView,
                              animated: animated,
                              interruptsCurrentScroll: false,
                              performsLayout: false
                          )
                      }
                  }
              }
          """

          new_bottom_chase = """    @MainActor
              private func scheduleBottomChase(animated: Bool) {
                  #if os(iOS) && !targetEnvironment(macCatalyst)
                  if ProcessInfo.processInfo.operatingSystemVersion.majorVersion == 18 {
                      bottomChaseTask?.cancel()
                      bottomChaseTask = nil
                      return
                  }
                  #endif

                  bottomChaseTask = Task { @MainActor [weak self] in
                      defer { self?.bottomChaseTask = nil }
                      for delay in [90, 180, 320, 520, 800, 1_200] {
                          try? await Task.sleep(for: .milliseconds(delay))
                          guard !Task.isCancelled, let collectionView = self?.collectionView else { return }
                          collectionView.layoutIfNeeded()
                          guard Self.distanceFromBottom(in: collectionView) > 3 else { return }
                          Self.scrollToBottom(
                              in: collectionView,
                              animated: animated,
                              interruptsCurrentScroll: false,
                              performsLayout: false
                          )
                      }
                  }
              }
          """

          if chat.count(old_bottom_chase) != 1:
              raise SystemExit(
                  f"Expected exactly one ChatTranscriptScrollController bottom-chase block, "
                  f"found {chat.count(old_bottom_chase)}; refusing to patch changed upstream source."
              )
          chat = chat.replace(old_bottom_chase, new_bottom_chase)

          chat_path.write_text(chat)

          print(
              "Applied iOS 18 navigation compatibility patch: NavigationSplitView is bypassed "
              "on iOS 18 only; ProjectListView remains upstream."
          )
          PY

          git diff --check
          git diff -- OpenCodeIOSClient/Views/Root/RootView.swift
          git diff -- OpenCodeIOSClient/Views/Chat/ChatView.swift

      - name: Build Debug app
        env:
          DISABLE_SWIFT_WORKAROUND: ${{ inputs.disable_swift_workaround || false }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          set -o pipefail

          # Forced builds of the same upstream commit need a unique bundle build number so
          # the installed IPA can be identified unambiguously. Preserve the upstream build
          # as the first numeric component, and append GitHub's monotonically increasing
          # workflow run number: e.g. upstream 46 -> forced build 46.123.
          EXTRA_BUILD_ARGS=()
          if [ "$FORCE_BUILD" = "true" ]; then
            UPSTREAM_BUILD="$(grep -m1 -E 'CURRENT_PROJECT_VERSION = [0-9]+;' OpenCodeIOSClient.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9]+);.*/\\1/')"
            test -n "$UPSTREAM_BUILD"
            FORCED_BUILD_NUMBER="${UPSTREAM_BUILD}.${GITHUB_RUN_NUMBER}"
            EXTRA_BUILD_ARGS+=("CURRENT_PROJECT_VERSION=${FORCED_BUILD_NUMBER}")
            echo "Forced build number: ${FORCED_BUILD_NUMBER}"
          fi

          build_app() {
            xcodebuild -project OpenCodeIOSClient.xcodeproj -scheme OpenCodeIOSClient \
              -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              "${EXTRA_BUILD_ARGS[@]}" build
          }

          # Always try the untouched upstream source first.
          if build_app 2>&1 | tee "$RUNNER_TEMP/openclient-build.log"; then
            exit 0
          fi

          # Only use temporary workarounds for known Swift compiler type-checker failures.
          if ! grep -q "compiler is unable to type-check this expression in reasonable time" "$RUNNER_TEMP/openclient-build.log"; then
            echo "::error::Normal build failed for an unrelated reason; temporary workaround not applied."
            exit 1
          fi

          HAS_NEW_PROJECT_FAILURE=false
          HAS_SIDE_QUESTION_FAILURE=false

          if grep -E -q "NewProjectChatFacade\.swift:[0-9]+:[0-9]+: error: the compiler is unable to type-check this expression in reasonable time" "$RUNNER_TEMP/openclient-build.log"; then
            HAS_NEW_PROJECT_FAILURE=true
          fi

          if grep -E -q "SideQuestionSheet\.swift:[0-9]+:[0-9]+: error: the compiler is unable to type-check this expression in reasonable time" "$RUNNER_TEMP/openclient-build.log"; then
            HAS_SIDE_QUESTION_FAILURE=true
          fi

          if [ "$HAS_NEW_PROJECT_FAILURE" != "true" ] && [ "$HAS_SIDE_QUESTION_FAILURE" != "true" ]; then
            echo "::error::Swift type-checker failure detected, but it is not one of the known workaround targets."
            grep -E "error: the compiler is unable to type-check this expression in reasonable time" "$RUNNER_TEMP/openclient-build.log" || true
            exit 1
          fi

          if [ "$DISABLE_SWIFT_WORKAROUND" = "true" ]; then
            echo "::error::Known Swift type-checker failure detected, but the Swift workaround was disabled by workflow input."
            exit 1
          fi

          echo "::warning::Known Swift type-checker failure detected. Applying targeted temporary workaround(s) and retrying."

          HAS_NEW_PROJECT_FAILURE="$HAS_NEW_PROJECT_FAILURE" HAS_SIDE_QUESTION_FAILURE="$HAS_SIDE_QUESTION_FAILURE" python3 - <<'PY'
          from pathlib import Path
          import os

          if os.environ["HAS_NEW_PROJECT_FAILURE"] == "true":
              path = Path("OpenCodeIOSClient/Facades/NewProjectChatFacade.swift")
              text = path.read_text()
              lines = text.splitlines(keepends=True)

              starts = [i for i, line in enumerate(lines) if line.strip() == "Publishers.MergeMany(["]
              if len(starts) != 1:
                  raise SystemExit(
                      f"Expected exactly one MergeMany observation block, found {len(starts)}; "
                      "refusing to apply NewProjectChatFacade workaround."
                  )

              start = starts[0]
              indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
              end = None
              for i in range(start + 1, len(lines) - 2):
                  if (
                      lines[i].strip() == "])"
                      and lines[i + 1].strip() == ".sink { [weak self] _ in self?.objectWillChange.send() }"
                      and lines[i + 2].strip() == ".store(in: &observations)"
                  ):
                      end = i + 2
                      break

              if end is None:
                  raise SystemExit(
                      "Known MergeMany closing block changed upstream; "
                      "refusing to apply NewProjectChatFacade workaround."
                  )

              entries = [line.strip() for line in lines[start + 1:end - 2] if line.strip()]
              if len(entries) < 2 or not all(
                  entry.startswith("viewModel.") and entry.endswith(",") for entry in entries
              ):
                  raise SystemExit(
                      "Unexpected MergeMany contents; refusing to apply NewProjectChatFacade workaround."
                  )

              declarations = [
                  f"{indent}let changePublisher{index}: AnyPublisher<Void, Never> = {entry[:-1]}\n"
                  for index, entry in enumerate(entries)
              ]
              names = [f"changePublisher{index}" for index in range(len(entries))]
              replacement = (
                  declarations
                  + [f"\n{indent}Publishers.MergeMany([\n"]
                  + [f"{indent}    {name},\n" for name in names]
                  + [
                      f"{indent}])\n",
                      f"{indent}.sink {{ [weak self] _ in self?.objectWillChange.send() }}\n",
                      f"{indent}.store(in: &observations)\n",
                  ]
              )

              patched = "".join(lines[:start] + replacement + lines[end + 1:])
              if patched == text:
                  raise SystemExit("NewProjectChatFacade workaround produced no source change.")
              path.write_text(patched)
              print(f"Temporary NewProjectChatFacade workaround applied to {len(entries)} publishers.")

          if os.environ["HAS_SIDE_QUESTION_FAILURE"] == "true":
              path = Path("OpenCodeIOSClient/Views/Chat/SideQuestionSheet.swift")
              text = path.read_text()

              old = """        let points = (0..<count).map { index -> CGPoint in
                      let angle = Double(index) * 2 * .pi / Double(count)
                      let wave = 1 + (1 - roundness) * (0.12 * sin(3 * angle + phase) + 0.07 * sin(2 * angle - phase * 1.25))
                      return CGPoint(x: rect.midX + horizontalRadius * wave * cos(angle),
                                     y: rect.midY + verticalRadius * wave * sin(angle))
                  }
              """

              new = """        let points: [CGPoint] = (0..<count).map { index in
                      let angle = Double(index) * 2.0 * Double.pi / Double(count)
                      let waveA = 0.12 * sin(3.0 * angle + phase)
                      let waveB = 0.07 * sin(2.0 * angle - phase * 1.25)
                      let roundnessFactor = 1.0 - Double(roundness)
                      let wave = 1.0 + roundnessFactor * (waveA + waveB)
                      let x = rect.midX + horizontalRadius * CGFloat(wave * cos(angle))
                      let y = rect.midY + verticalRadius * CGFloat(wave * sin(angle))
                      return CGPoint(x: x, y: y)
                  }
              """

              if text.count(old) != 1:
                  raise SystemExit(
                      f"Expected exactly one SideQuestionBlobShape points expression, found {text.count(old)}; "
                      "refusing to apply SideQuestionSheet workaround."
                  )

              path.write_text(text.replace(old, new))
              print("Temporary SideQuestionSheet type-checker workaround applied.")
          PY

          git diff --check
          if [ "$HAS_NEW_PROJECT_FAILURE" = "true" ]; then
            git diff -- OpenCodeIOSClient/Facades/NewProjectChatFacade.swift
          fi
          if [ "$HAS_SIDE_QUESTION_FAILURE" = "true" ]; then
            git diff -- OpenCodeIOSClient/Views/Chat/SideQuestionSheet.swift
          fi

          rm -rf "$RUNNER_TEMP/DerivedData"
          build_app

      - name: Package and inspect IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" >> "$GITHUB_ENV"
          echo "APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" >> "$GITHUB_ENV"
          mkdir Payload && cp -R "$APP_PATH" Payload/
          zip -qry OpenClient-Debug.ipa Payload
          echo "IPA_SIZE=$(stat -f%z OpenClient-Debug.ipa)" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClient-Debug
          path: OpenClient-Debug.ipa
          if-no-files-found: error

      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          repository: wes1993/OpenClient_Debug
          path: automation

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="openclient-${UPSTREAM_SHA:0:12}"
          if gh release view "$TAG" --repo wes1993/OpenClient_Debug >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing IPA asset with this build."
            gh release upload "$TAG" OpenClient-Debug.ipa --repo wes1993/OpenClient_Debug --clobber
          else
            gh release create "$TAG" OpenClient-Debug.ipa --repo wes1993/OpenClient_Debug \
              --title "OpenClient Debug $APP_VERSION ($APP_BUILD)" \
              --notes "Automated Debug build from upstream commit $UPSTREAM_SHA."
          fi

      - name: Update AltStore catalog
        env:
          ALTSTORE_TOKEN: ${{ secrets.ALTSTORE_REPO_TOKEN }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$ALTSTORE_TOKEN" ]; then
            echo "::error::Missing ALTSTORE_REPO_TOKEN secret."
            exit 1
          fi
          git clone "https://x-access-token:$ALTSTORE_TOKEN@github.com/wes1993/altstore-repo.git" catalog
          cd catalog
          TAG="openclient-${UPSTREAM_SHA:0:12}"
          URL="https://github.com/wes1993/OpenClient_Debug/releases/download/$TAG/OpenClient-Debug.ipa"
          DATE="$(date -u +%Y-%m-%d)"

          PREVIOUS="$(cat ../automation/state/upstream-sha.txt 2>/dev/null || true)"
          RELEASE_NOTES_PATH="../fastlane/metadata/it/release_notes.txt"
          CHANGELOG=""

          # Prefer the upstream Italian release notes only when that file changed
          # between the previously published SHA and the SHA being published now.
          if [ -n "$PREVIOUS" ] && git -C .. cat-file -e "$PREVIOUS^{commit}" 2>/dev/null; then
            if git -C .. diff --quiet "$PREVIOUS" "$UPSTREAM_SHA" -- fastlane/metadata/it/release_notes.txt; then
              echo "Upstream release_notes.txt was not updated; using all upstream commit messages."
            else
              CHANGELOG="$(cat "$RELEASE_NOTES_PATH" 2>/dev/null || true)"
            fi
          fi

          # Fallback: include every upstream commit message, without filtering.
          if [ -z "$CHANGELOG" ]; then
            if [ -n "$PREVIOUS" ] && git -C .. cat-file -e "$PREVIOUS^{commit}" 2>/dev/null; then
              CHANGELOG="$(git -C .. log --reverse --format='• %s%n%b' "$PREVIOUS..$UPSTREAM_SHA")"
            else
              CHANGELOG="$(git -C .. show -s --format='%s%n%b' "$UPSTREAM_SHA")"
            fi
          fi

          # Keep the exact upstream SHA visible for traceability.
          CHANGELOG="$(printf '%s\n\nUpstream commit: %s' "$CHANGELOG" "$UPSTREAM_SHA")"

          jq --arg version "$APP_VERSION" --arg build "$APP_BUILD" --arg bundle "$APP_BUNDLE_ID" \
             --arg date "$DATE" --arg url "$URL" --arg changelog "$CHANGELOG" --argjson size "$IPA_SIZE" '
            .apps = (if any(.apps[]?; .bundleIdentifier == $bundle) then .apps else
              .apps + [{"name":"OpenClient","bundleIdentifier":$bundle,"developerName":"OpenClient",
              "subtitle":"Personal non-commercial Debug build",
              "localizedDescription":"Automated personal Debug build from the upstream OpenClient source.",
              "iconURL":"https://raw.githubusercontent.com/ntoporcov/openclient/main/OpenCodeIOSClient/Assets.xcassets/AppIcon.appiconset/ios-1024.png","versions":[]}] end) |
            .apps |= map(if .bundleIdentifier == $bundle then
              .versions = ([{"version":$version,"buildVersion":$build,"date":$date,"downloadURL":$url,
              "size":$size,"localizedDescription":$changelog}] +
              [.versions[]? | select((.version != $version) or (.buildVersion != $build))])
            else . end)
          ' apps.json > apps.tmp
          mv apps.tmp apps.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apps.json
          git commit -m "Update OpenClient to $APP_VERSION ($APP_BUILD)" || true
          git push

      - name: Record processed upstream commit
        if: success()
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: |
          cd automation
          mkdir -p state
          printf '%s\n' "$UPSTREAM_SHA" > state/upstream-sha.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add state/upstream-sha.txt
          git commit -m "Record upstream $UPSTREAM_SHA" || true

          # The automation repository may have changed while this long macOS build was running
          # (for example when a workflow patch is committed). Rebase before pushing so a
          # harmless concurrent workflow edit does not make an otherwise successful build fail.
          git pull --rebase origin main
          git push
